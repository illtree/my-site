{{ define "main" }}
<article class="post-single">
  <nav class="breadcrumb" aria-label="面包屑路径" style="font-size: 0.85rem; color: var(--text-subtle); margin-bottom: 1.5rem;">
    <a href="{{ "/" | relURL }}" style="color: var(--text-muted);">首页</a>
    <span style="margin: 0 0.5rem; opacity: 0.5;">/</span>
    <a href="{{ "/posts/" | relURL }}" style="color: var(--text-muted);">文章</a>
    <span style="margin: 0 0.5rem; opacity: 0.5;">/</span>
    <span>正文</span>
  </nav>

  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    <div class="page-meta">
      <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time>
      <span>约 {{ .WordCount }} 字</span>
      <span>阅读需 {{ .ReadingTime }} 分钟</span>
      {{ with .Params.tags }}
        <span>标签：{{ delimit . ", " }}</span>
      {{ end }}
    </div>
  </header>

  <div class="prose">
    {{ .Content }}
  </div>

  <footer style="margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--border-color); display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
    <div style="display: flex; align-items: center; gap: 1.25rem;">
      <a href="{{ "/" | relURL }}" style="color: var(--accent-color); font-weight: 500; font-size: 0.95rem;">返回首页</a>
      <span style="color: var(--border-color);">|</span>
      <a href="{{ "/posts/" | relURL }}" style="color: var(--text-muted); font-size: 0.95rem;">返回文章列表</a>
    </div>
    <a href="#top" style="color: var(--text-subtle); font-size: 0.95rem;">回到顶部</a>
  </footer>
</article>
{{ end }}
