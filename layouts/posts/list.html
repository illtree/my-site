{{ define "main" }}
<div class="posts-page">
  <header class="page-header">
    <h1 class="page-title">文章与思考</h1>
    <p class="hero-desc">关于软件开发、产品设计、工具与生活观察的记录。</p>
  </header>

  <div class="post-list">
    {{ range .Pages.ByDate.Reverse }}
      <article class="post-item">
        <div class="post-item-top">
          <a href="{{ .RelPermalink }}" class="post-item-title">{{ .Title }}</a>
          <time class="post-item-date" datetime="{{ .Date.Format "2006-01-02" }}">
            {{ .Date.Format "2006-01-02" }}
          </time>
        </div>
        {{ with .Description | default .Summary }}
          <p class="post-item-summary">{{ . }}</p>
        {{ end }}
      </article>
    {{ else }}
      <p class="text-muted">暂无文章。</p>
    {{ end }}
  </div>
</div>
{{ end }}
