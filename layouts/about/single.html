{{ define "main" }}
<article class="article wrap about-page">
  <nav class="breadcrumb" aria-label="面包屑路径" style="font-size: 0.85rem; color: var(--muted); margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.5rem;">
    <a href="{{ site.Home.RelPermalink }}" style="color: var(--muted); font-weight: 500;">首页</a>
    <span style="opacity: 0.4;">/</span>
    <span>关于我</span>
  </nav>

  <header class="article-header">
    <div style="display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.5rem;">
      <svg class="page-head-icon" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width: 1.85rem; height: 1.85rem; color: var(--accent);">
        <rect x="3.5" y="6.5" width="25" height="19" rx="4"/>
        <path d="M4 8.5L14.3 16.5C15.3 17.2 16.7 17.2 17.7 16.5L28 8.5"/>
        <circle cx="16" cy="18.5" r="1.2" fill="currentColor"/>
      </svg>
      <h1 style="margin: 0;">{{ .Title }}</h1>
    </div>
  </header>

  <div class="about-meta">
    <span class="about-monogram">{{ with .Site.Params.name }}{{ substr . 0 1 }}{{ else }}我{{ end }}</span>
    <div>
      <strong>{{ .Site.Params.name | default .Site.Params.author }}</strong>
      <span>{{ .Site.Params.location }}</span>
    </div>
  </div>

  <div class="content-body">
    {{ .Content }}
  </div>

  <div class="contact-card">
    <div class="contact-info">
      <span>想聊聊？欢迎来信。</span>
      <strong id="email-address">{{ .Site.Params.email }}</strong>
    </div>
    <div class="contact-actions">
      <button type="button" id="copy-email-btn" class="copy-btn" aria-label="复制邮箱地址" title="复制邮箱地址">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
        <span id="copy-btn-text">复制邮箱</span>
      </button>
      <a class="mail-btn" href="mailto:{{ .Site.Params.email }}" title="调用本地邮件客户端" aria-label="发送邮件">
        发送邮件
      </a>
    </div>
  </div>

  <script>
    (function() {
      const copyBtn = document.getElementById('copy-email-btn');
      const emailElem = document.getElementById('email-address');
      const copyText = document.getElementById('copy-btn-text');
      if (!copyBtn || !emailElem || !copyText) return;

      copyBtn.addEventListener('click', function() {
        const email = emailElem.textContent.trim();
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(email).then(showSuccess, fallbackCopy);
        } else {
          fallbackCopy();
        }

        function fallbackCopy() {
          const temp = document.createElement('textarea');
          temp.value = email;
          temp.setAttribute('readonly', '');
          temp.style.position = 'absolute';
          temp.style.left = '-9999px';
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
          showSuccess();
        }

        function showSuccess() {
          const original = copyText.textContent;
          copyText.textContent = '已复制 ✓';
          copyBtn.classList.add('copied');
          setTimeout(function() {
            copyText.textContent = original;
            copyBtn.classList.remove('copied');
          }, 2000);
        }
      });
    })();
  </script>

  <footer style="margin-top: 3.5rem; padding-top: 1.5rem; border-top: 1px dashed var(--line); display: flex; justify-content: space-between; align-items: center;">
    <a href="{{ site.Home.RelPermalink }}" style="color: var(--accent); font-weight: 500; font-size: 0.95rem;">返回首页</a>
    <a href="#top" style="color: var(--quiet); font-size: 0.95rem;">回到顶部</a>
  </footer>
</article>
{{ end }}
