{{ define "main" }}
<div class="page-list">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ with .Description }}
      <p class="hero-desc">{{ . }}</p>
    {{ end }}
  </header>

  <div class="post-list">
    {{ range .Pages }}
      <article class="post-item">
        <div class="post-item-top">
          <a href="{{ .RelPermalink }}" class="post-item-title">{{ .Title }}</a>
          {{ if not .Date.IsZero }}
            <time class="post-item-date" datetime="{{ .Date.Format "2006-01-02" }}">
              {{ .Date.Format "2006-01-02" }}
            </time>
          {{ end }}
        </div>
        {{ with .Description | default .Summary }}
          <p class="post-item-summary">{{ . }}</p>
        {{ end }}
      </article>
    {{ else }}
      <p class="text-muted">本栏目暂无内容。</p>
    {{ end }}
  </div>
</div>
{{ end }}
