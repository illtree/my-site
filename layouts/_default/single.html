{{ define "main" }}
<article class="page-single">
  <header class="page-header">
    <h1 class="page-title">{{ .Title }}</h1>
    {{ if not .Date.IsZero }}
      <div class="page-meta">
        <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006年01月02日" }}</time>
        {{ with .Params.author }}<span>{{ . }}</span>{{ end }}
      </div>
    {{ end }}
  </header>

  <div class="prose">
    {{ .Content }}
  </div>
</article>
{{ end }}
