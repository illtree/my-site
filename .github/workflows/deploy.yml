name: Sync Notion & Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch: # 仅在需要时手动一键触发
  repository_dispatch: # 支持外部指定触发
    types: [notion-publish]

# 授予 GitHub Pages 部署和仓库内容写入权限
permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Node Dependencies
        run: npm ci

      - name: Sync Posts from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: node scripts/sync-notion.mjs

      - name: Commit & Push synced posts to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A content/posts static/images
          if ! git diff --cached --quiet; then
            git commit -m "chore(notion): sync latest posts and images [skip ci]"
            git push
          else
            echo "No new Notion updates to commit."
          fi

      - name: Run Automated Tests
        run: npm test

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build Hugo Site
        run: hugo --minify -b "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
